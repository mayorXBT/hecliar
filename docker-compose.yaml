# Inco local node (Anvil + covalidator) for the mainnet pepper.
# The v1.0.2 images match the pinned @inco/lightning packages.
services:
  anvil:
    image: inconetwork/local-node-anvil-mainnet:v1.0.2
    ports:
      - "8545:8545"

  covalidator:
    image: inconetwork/local-node-covalidator-mainnet:v1.0.2
    depends_on:
      anvil:
        condition: service_healthy
    ports:
      - "50055:50055"
